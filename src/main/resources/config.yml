# UPGRADES
# menu item: no cost!
# slot: 0-26
menu:
  0:
    material: IRON_SWORD
    amount: 1
    slot: 9
    name: "» Weapon Upgrades"
    lore: "Adds enchantments to ALL SWORDS    and AXES in your inventory."
   #lore: "1234567890123456789012345678901234567890
  1:
    material: BOW
    amount: 1
    slot: 10
    name: "» Bow Upgrades"
    lore: "Adds enchantments to ALL BOWS      in your inventory."
  2:
    material: ENDER_PEARL
    amount: 1
    slot: 11
    name: "» Mobility"
    lore: "Use commands, purchase the ability to double jump or reduce the Grappler cooldown."
  3:
    material: ARROW
    amount: 1
    slot: 12
    name: "» Arrow Upgrades"
    lore: "Increases ARROWS GENERATED and     allows you to obtain EFFECT ARROWS."
  4:
    material: DIAMOND_PICKAXE
    amount: 1
    slot: 13
    name: "» Tool Upgrades"
    lore: "Adds enchantments to ALL AXES,     PICKAXES, HOES and SHOVELS in your inventory."
  5:
    material: GOLDEN_CHESTPLATE
    amount: 1
    slot: 14
    name: "» Armor Upgrades"
    lore: "Adds enchantments to ALL           ARMOR PIECES in your armor slots."
  6:
    material: COOKED_BEEF
    amount: 1
    slot: 15
    name: "» Food Upgrades"
    lore: "Upgrade to better FOOD SOURCES     and receive TRIPLE or QUADRUPLE FOOD from entities."
  7:
    material: IRON_INGOT
    amount: 1
    slot: 16
    name: "» Resource Upgrades"
    lore: "Obtain DOUBLE, TRIPLE and even     QUADRUPLE RESOURCES from ores."
  8:
    material: EXPERIENCE_BOTTLE
    amount: 1
    slot: 17
    name: "» XP Upgrades"
    lore: "Gain more EXPERIENCE POINTS.        "
