api-version: 1.19
authors: [ Tharox ]
description: Dragonhunt by Tharox

commands:
  date:
    description: Shows the current date.
  modifiers:
    description: Opens the modifiers inventory.
  m:
    description: Opens the modifiers inventory.
  top:
    description: Teleports the player to the surface.
  scout:
    description: Players can be in Spectator Mode for a short time.
  respawn:
    description: Sets your respawn point at your current location.
  hub:
    description: Brings you back to the lobby.
  lobby:
    description: Brings you back to the lobby.
  l:
    description: Brings you back to the lobby.
  stats:
    description: Displays your stats or the stats of another player.
  talent:
    description: Applies your selected kit talent option.